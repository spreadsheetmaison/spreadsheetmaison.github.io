<head>

<title>ADHD Budget Planner · Safe to Spend</title>
<style>
:root{
  --bg:#0F172A; --surface:#1E293B; --surface2:#273449; --line:#334155;
  --text:#E2E8F0; --muted:#94A3B8; --faint:#64748B;
  --accent:#5EEAD4; --accent-ink:#042F2E; --accent-soft:rgba(94,234,212,.12);
  --amber:#FBBF24; --amber-soft:rgba(251,191,36,.14);
  --coral:#FB7185; --coral-soft:rgba(251,113,133,.14);
  --radius:16px; --tap:48px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface2:#EEF2F6; --line:#DCE3EB;
  --text:#0F172A; --muted:#556274; --faint:#8592A3;
  --accent:#0F766E; --accent-ink:#FFFFFF; --accent-soft:rgba(15,118,110,.10);
  --amber:#B45309; --amber-soft:rgba(180,83,9,.10);
  --coral:#BE123C; --coral-soft:rgba(190,18,60,.09);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 6px}
header.top h1{font-size:15px;font-weight:650;letter-spacing:.02em;margin:0;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .row{gap:2px;flex:none}
header.top .date{font-size:13px;color:var(--faint);white-space:nowrap}
@media (max-width:359px){header.top h1{font-size:14px;letter-spacing:0}header.top .date{font-size:12px}}
.icon-btn{min-width:var(--tap);min-height:var(--tap);border:0;background:transparent;border-radius:12px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:20px;margin:18px 0 10px;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.hero{padding:22px 18px 18px;text-align:left}
.hero .label{font-size:14px;color:var(--muted);margin:0 0 4px}
.hero .big{font-size:clamp(44px,15vw,72px);font-weight:750;letter-spacing:-.02em;line-height:1.05;margin:2px 0 6px}
.hero .sub{color:var(--muted);font-size:15px}
.big.ok{color:var(--accent)} .big.tight{color:var(--amber)} .big.over{color:var(--coral)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;margin-top:12px}
.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.tight{background:var(--amber-soft);color:var(--amber)} .pill.over{background:var(--coral-soft);color:var(--coral)}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{min-height:var(--tap);padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:600;text-wrap:balance}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:0 12px;border-radius:10px;font-size:14px}
.btn.wide{flex:1 1 auto}
.btn.danger{color:var(--coral)}
.list{list-style:none;margin:0;padding:0}
/* list rows: name + amount on the first line; on phones the buttons get their own line, so a long name never shrinks into a one-letter column */
.list li{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li>.amt,.list li>.btn{flex:none}
.list .t{font-weight:600;overflow-wrap:break-word}
.list .row.between>.t{flex:1 1 auto;min-width:0}
.list .row.between>.small{flex:none;white-space:nowrap}
.list .s{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:1 0 100%}
@media (min-width:520px){.list li>.acts{flex:none}}
.amt{font-weight:650;white-space:nowrap}
.chip{display:inline-block;font-size:12px;font-weight:650;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:middle;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)} .chip.tight{background:var(--amber-soft);color:var(--amber)} .chip.over{background:var(--coral-soft);color:var(--coral)}
details.break summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:40px;display:flex;align-items:center}
.break table{width:100%;border-collapse:collapse;font-size:15px}
.break td{padding:6px 0;border-top:1px dashed var(--line)}
.break td:last-child{text-align:right}
.break tr.total td{font-weight:700;border-top:1px solid var(--line)}
.banner{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.banner>.grow{flex:1 1 150px}
.banner>.btn{margin-left:auto}
.banner.info{background:var(--accent-soft);color:var(--text)}
.banner.warn{background:var(--amber-soft);color:var(--text)}
.banner b{color:var(--text)}
.empty{color:var(--muted);font-size:15px;padding:8px 0}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.in{width:100%;min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 14px}
textarea.in{padding:12px 14px;min-height:84px;resize:vertical}
.in.bigin{font-size:28px;font-weight:700;min-height:64px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar>i.tight{background:var(--amber)} .bar>i.over{background:var(--coral)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.menu a{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 4px;color:var(--text);text-decoration:none;border-top:1px solid var(--line);font-weight:600}
.menu a:first-child{border-top:0}
.menu a span{color:var(--muted);font-weight:400;font-size:14px}
.fineprint{color:var(--faint);font-size:12px;text-align:center;margin:26px 0 10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));display:flex;justify-content:center;z-index:10}
nav.tabs .in2{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;min-height:56px;border:0;background:transparent;cursor:pointer;color:var(--faint);font-size:12px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
.sheet-bg{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));max-height:92vh;overflow:auto;border:1px solid var(--line)}
.sheet h2{margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:90vw}
.back{margin:10px 0 0}
.muted{color:var(--muted)}
.right{text-align:right}
.small{font-size:13px}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1>ADHD Budget Planner</h1>
    <div class="row"><span class="date" id="hdrDate"></span>
      <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark mode" title="Light / dark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Main">
  <div class="in2">
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
    <button data-tab="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/></svg>Bills</button>
    <button data-tab="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Spend</button>
    <button data-tab="pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>Pause</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
  </div>
</nav>
<input type="file" id="importFile" accept="application/json,.json" class="hide">
<script>
"use strict";
/* ---------- storage ---------- */
const KEY = "adhd-budget-planner.v1";
let canSave = true;
const CATS = [
  ["Groceries","needs"],["Eating out","wants"],["Transport","needs"],["Shopping","wants"],["Fun","wants"],
  ["Health","needs"],["Kids & pets","needs"],["Home","needs"],["Gifts","wants"],["Other","wants"]];
const BILL_CATS = ["Housing","Utilities","Phone & internet","Insurance","Subscriptions","Debt payment","Other bill"];
function fresh(){
  return {v:1, setupDone:false, example:false, setupTs:0, lastBackupTs:0, nagUntil:0,
    settings:{currency:"USD", payFreq:"biweekly", payAnchor:null, paycheck:0, dailyComfort:2000, setAside:0, extraIncome:0, theme:"dark"},
    balance:{amount:0, date:null, ts:0},
    bills:[], tx:[], pause:[],
    cats:CATS.map(([name,bucket])=>({name,bucket,limit:0})),
    buckets:{bills:50, needs:20, wants:10, savings:10, debt:10},
    debts:[], debtExtra:0, debtMethod:"snowball", goals:[], reviews:{}};
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const s = JSON.parse(raw); if(s && s.v===1) return Object.assign(fresh(), s); } }
  catch(e){ canSave = false; }
  return fresh();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); canSave = true; }catch(e){ canSave = false; } }

/* ---------- dates (local calendar days as YYYY-MM-DD) ---------- */
const pad = n => String(n).padStart(2,"0");
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); };
const todayS = () => window.__TODAY__ || ds(new Date());
const nowTs = () => window.__NOW__ || Date.now();
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const dim = (y,m) => new Date(y, m+1, 0).getDate();
const diffDays = (a,b) => Math.round((pd(b)-pd(a))/864e5);
const maxS = (a,b) => (a > b ? a : b);
function addMonthsAnchor(anchor, k){
  const a = pd(anchor); const m = a.getMonth()+k; const y = a.getFullYear()+Math.floor(m/12); const mm = ((m%12)+12)%12;
  return ds(new Date(y, mm, Math.min(a.getDate(), dim(y,mm)), 12));
}
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const monthFirst = () => S.settings.currency==="USD" || S.settings.currency==="CAD";   // US / Canada write "Sun, Nov 1", everyone else "Sun 1 Nov"
const nice = s => { const d = pd(s), dd = DAYS[d.getDay()], m = MONTHS[d.getMonth()];   // no-break spaces: a date never splits over two lines
  return monthFirst() ? `${dd}, ${m} ${d.getDate()}` : `${dd} ${d.getDate()} ${m}`; };

/* occurrences of a repeating date strictly after `after` and on or before `upTo` */
function occ(freq, anchor, after, upTo){
  const out = []; if(!anchor) return out;
  if(freq==="once"){ if((!after || anchor>after) && anchor<=upTo) out.push(anchor); return out; }
  if(freq==="weekly" || freq==="biweekly"){            // the anchor may lie before or after `after`: step from it either way
    const step = freq==="weekly" ? 7 : 14; let d = anchor;
    if(after){ d = addDays(anchor, Math.floor(diffDays(anchor,after)/step)*step); }
    for(let g=0; d<=upTo && g<2000; g++){ if(!after || d>after) out.push(d); d = addDays(d, step); }
    return out;
  }
  if(freq==="semimonthly"){                    // 15th and last day of every month
    let d = after ? addDays(after,1) : anchor;
    for(let g=0; d<=upTo && g<4000; g++){ const x = pd(d); const day = x.getDate(); if(day===15 || day===dim(x.getFullYear(),x.getMonth())) out.push(d); d = addDays(d,1); }
    return out;
  }
  const step = freq==="yearly" ? 12 : 1; let k = 0;
  if(after){ const a = pd(anchor), b = pd(after); k = Math.floor(((b.getFullYear()-a.getFullYear())*12 + b.getMonth()-a.getMonth())/step) - 1; }
  for(let g=0; g<5000; g++, k++){ const d = addMonthsAnchor(anchor, k*step); if(d>upTo) break; if(!after || d>after) out.push(d); }
  return out;
}
function nextPayday(t){
  const s = S.settings; if(!s.payAnchor) return addDays(t, 14);
  return occ(s.payFreq, s.payAnchor, t, addDays(t, 400))[0] || addDays(t, 14);
}
function prevPayday(t){
  const s = S.settings; if(!s.payAnchor) return addDays(t, -14);
  const list = occ(s.payFreq, s.payAnchor, addDays(t, -400), t); return list.length ? list[list.length-1] : addDays(t,-14);
}

/* ---------- money ---------- */
/* amounts follow the currency's own convention, not the phone's language: USD is $1,240.50 on a Polish or German phone too */
const CUR_LOCALE = {USD:"en-US", CAD:"en-CA", GBP:"en-GB", EUR:"en-IE", AUD:"en-AU", NZD:"en-NZ", CHF:"de-CH", SEK:"sv-SE", NOK:"nb-NO", DKK:"da-DK",
  PLN:"pl-PL", ZAR:"en-ZA", INR:"en-IN", SGD:"en-SG", JPY:"ja-JP", MXN:"es-MX", BRL:"pt-BR"};
const NF = {};
function money(c, whole){
  const cur = S.settings.currency, k = cur + (whole ? "0" : "");
  try{
    if(!NF[k]) NF[k] = new Intl.NumberFormat(CUR_LOCALE[cur] || "en-US", whole ? {style:"currency", currency:cur, minimumFractionDigits:0, maximumFractionDigits:0} : {style:"currency", currency:cur});
    return NF[k].format(whole ? Math.round(c/100) : c/100);
  }catch(e){ return `${c < 0 ? "-" : ""}${cur} ${(Math.abs(whole ? Math.round(c/100)*100 : c)/100).toFixed(whole ? 0 : 2)}`; }
}
const fmt = c => money(c, false);
const fmt0 = c => money(c, true);
function parseMoney(v){
  if(v==null) return NaN; let s = String(v).trim().replace(/[^\d.,-]/g,""); if(!s) return NaN;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if(lc>-1 && ld>-1){ s = lc>ld ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(lc>-1){ s = /,\d{1,2}$/.test(s) ? s.replace(",",".") : s.replace(/,/g,""); }
  const n = Number(s); return isFinite(n) ? Math.round(n*100) : NaN;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- the engine: safe to spend until payday ---------- */
function billPaidThrough(b){ return maxS(b.paidThrough || "", addDays(b.anchor, -1)); }   // a bill never has dues before its first due date
function billCountedAfter(b){                 // occurrences after this date still have to leave the account
  const pt = billPaidThrough(b);
  return b.autopay && S.balance.date ? maxS(pt, addDays(S.balance.date, -1)) : pt;   // autopay before the balance date is already out of the balance
}
function compute(){
  const t = todayS(), pay = nextPayday(t), days = Math.max(1, diffDays(t, pay));
  const bal = S.balance;
  const since = S.tx.filter(x => x.ts > bal.ts && (!bal.date || x.date >= bal.date));
  const outflows = since.reduce((a,x) => a + x.amount, 0);
  const billsDue = [];
  for(const b of S.bills){ for(const d of occ(b.freq, b.anchor, billCountedAfter(b), pay)) billsDue.push({b, d}); }
  billsDue.sort((x,y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0);
  const billSum = billsDue.reduce((a,x) => a + x.b.amount, 0);
  const setAside = S.settings.setAside || 0, extra = S.settings.extraIncome || 0;
  const safe = bal.amount - outflows - billSum - setAside + extra;
  const perDay = safe > 0 ? Math.floor(safe/days) : 0;
  const status = safe < 0 ? "over" : perDay < (S.settings.dailyComfort || 0) ? "tight" : "ok";
  return {t, pay, days, balance:bal.amount, outflows, billsDue, billSum, setAside, extra, safe, perDay, status};
}
function billView(b){
  const t = todayS(); const after = b.autopay ? maxS(billPaidThrough(b), addDays(t,-1)) : billPaidThrough(b);
  const next = occ(b.freq, b.anchor, after, addDays(t, 800))[0] || null;
  let state = "later";
  if(next){ const dd = diffDays(t, next); state = dd < 0 ? "look" : dd <= 3 ? "soon" : "later"; }
  return {next, state, days: next ? diffDays(t, next) : null};
}
function debtPlan(debts, extra, method){
  const list = debts.filter(d => d.balance > 0).map(d => ({id:d.id, name:d.name, bal:d.balance, apr:d.apr, min:d.min, paidOff:null}));
  if(!list.length) return {months:0, interest:0, order:[], ok:true};
  const order = list.slice().sort(method==="avalanche" ? (a,b) => b.apr-a.apr || a.bal-b.bal : (a,b) => a.bal-b.bal || b.apr-a.apr);
  const budget = list.reduce((a,d) => a + d.min, 0) + (extra || 0);
  let interest = 0, m = 0;
  while(list.some(d => d.bal > 0) && m < 600){
    m++; let pot = budget;
    for(const d of list){ if(d.bal > 0){ const i = Math.round(d.bal * d.apr / 1200); d.bal += i; interest += i; } }
    for(const d of list){ if(d.bal > 0){ const p = Math.min(d.min, d.bal); d.bal -= p; pot -= p; } }
    for(const d of order){ if(pot <= 0) break; if(d.bal > 0){ const p = Math.min(pot, d.bal); d.bal -= p; pot -= p; } }
    for(const d of list){ if(d.bal <= 0 && d.paidOff === null) d.paidOff = m; }
  }
  const ok = !list.some(d => d.bal > 0);
  return {months: ok ? m : null, interest, ok, order: order.map(d => ({id:d.id, name:d.name, paidOff:d.paidOff}))};
}

/* ---------- ui helpers ---------- */
let route = {tab:"today", sub:null};
const view = document.getElementById("view");
const clearToasts = () => document.querySelectorAll(".toast").forEach(x => x.remove());
function toast(msg){ clearToasts(); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }   // one at a time, never stacked
function sheet(html, onSubmit){
  clearToasts();                                                     // a toast must not cover the form that opens next
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<form class="sheet" novalidate>${html}</form>`;
  document.body.appendChild(bg);
  const form = bg.querySelector("form");

  const sp = (d, amount, cat, type, note) => S.tx.push({id:uid(), kind:"spend", amount, cat, type, note, date:addDays(t,-d), ts:n - d*day - 6e5});
  sp(7,6420,"Groceries","planned",""); sp(6,1450,"Eating out","impulse","Late-night delivery"); sp(6,3800,"Transport","planned","Gas");
  sp(5,2399,"Shopping","impulse","Desk organiser"); sp(4,1875,"Fun","planned","Cinema"); sp(3,5230,"Groceries","planned","");
  sp(2,899,"Eating out","unsure","Coffee + bagel"); sp(1,4210,"Kids & pets","planned","Dog food"); sp(1,1260,"Eating out","impulse","");
  S.tx.push({id:uid(), kind:"spend", amount:1840, cat:"Groceries", type:"planned", note:"", date:t, ts:n - 36e5});
  S.cats.forEach(c => { c.limit = {"Groceries":40000,"Eating out":12000,"Shopping":10000,"Fun":8000}[c.name] || 0; });
  S.pause.push({id:uid(), item:"Noise-cancelling headphones", price:17900, addedTs:n - 30*36e5, readyAt:n - 6*36e5, decision:null});
  S.pause.push({id:uid(), item:"Planner stickers", price:1450, addedTs:n - 4*36e5, readyAt:n + 20*36e5, decision:null});
  S.pause.push({id:uid(), item:"Second hoodie", price:4800, addedTs:n - 5*day, readyAt:n - 4*day, decision:"skip", decidedDate:addDays(t,-3)});
  S.debts.push({id:uid(), name:"Visa", balance:234000, apr:24.9, min:7000}, {id:uid(), name:"Store card", balance:48000, apr:29.9, min:3000}, {id:uid(), name:"Car loan", balance:620000, apr:6.9, min:21000});
  S.debtExtra = 10000;
  S.goals.push({id:uid(), name:"Emergency buffer", target:100000, saved:42000, date:addDays(t,150)}, {id:uid(), name:"Holiday gifts", target:30000, saved:12000, date:addDays(t,50)});
  S.reviews[t.slice(0,7)] = {win:"Paid every bill on time this month.", surprise:"Coffee adds up faster than I thought.", tweak:"Park online buys for 48 h."};
  save();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const tab = e.target.closest("nav.tabs button"); if(tab){ route = {tab:tab.dataset.tab, sub:null}; render(); window.scrollTo(0,0); return; }
  const go = e.target.closest("[data-tab-go]"); if(go){ route = {tab:go.dataset.tabGo, sub:null}; render(); return; }
  const sub = e.target.closest("[data-sub]"); if(sub){ e.preventDefault(); route.sub = sub.dataset.sub; render(); window.scrollTo(0,0); return; }
  const act = e.target.closest("main [data-act]"); if(act && A[act.dataset.act]){ e.preventDefault(); A[act.dataset.act](act); return; }
  const dm = e.target.closest('main .seg[data-name="dm"] button'); if(dm){ S.debtMethod = dm.dataset.v; save(); render(); }
});
document.addEventListener("input", e => { const r = e.target.dataset && e.target.dataset.rv; if(r){ const mo = route.month || todayS().slice(0,7); S.reviews[mo] = Object.assign(S.reviews[mo] || {}, {[r]: e.target.value}); save(); } });
document.getElementById("themeBtn").addEventListener("click", () => { S.settings.theme = S.settings.theme==="dark" ? "light" : "dark"; save(); render(); });
document.getElementById("importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => { try{ const o = JSON.parse(r.result); if(!o || o.v!==1 || !Array.isArray(o.bills) || !o.settings) throw 0;
      confirmSheet("Open this backup?", "It replaces what's on this device now.", "Open backup", () => { S = Object.assign(fresh(), o); save(); route = {tab:"today", sub:null}; render(); toast("Backup opened"); }); }
    catch(err){ toast("That file isn't a planner backup"); } e.target.value = ""; };
  r.readAsText(f);
});
window.addEventListener("storage", e => { if(e.key===KEY){ S = load(); render(); } });
setInterval(() => { if(!document.querySelector(".sheet-bg") && route.tab==="pause") render(); }, 60000);

/* install support when served from a web address (no effect when opened as a file) */
if(location.protocol==="https:" || location.hostname==="localhost"){
  for(const [rel, href] of [["manifest","manifest.webmanifest"],["apple-touch-icon","icon-180.png"]]){ const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); }
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
if(S.setupDone && !S.setupTs){ S.setupTs = nowTs(); save(); }          // planners saved before this field existed
if(isWeb() && navigator.storage && navigator.storage.persist){           // ask the browser not to evict the planner's data (granted more readily for Home Screen apps)
  navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
}
window.APP = {compute, debtPlan, occ, nextPayday, prevPayday, billView, parseMoney, fmt, fmt0, get state(){ return S; }, set state(v){ S = v; save(); render(); }};
render();
</script>
</body>
